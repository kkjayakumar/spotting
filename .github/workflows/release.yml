name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotting_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Verification Gate
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3003
          NEXT_PUBLIC_APP_URL: http://localhost:3003
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
        run: npm run verify

      - name: Get Playwright Version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/^\\^/, '')")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & Deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright System Dependencies (if cached)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Ensure Playwright Chromium (cache may be stale)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotting_release?schema=public
          NEXT_PUBLIC_SITE_URL: http://localhost:3003
          NEXT_PUBLIC_APP_URL: http://localhost:3003
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
          SPOTTING_API_INTERNAL_URL: http://127.0.0.1:3000
          CORS_ORIGINS: http://localhost:3003
        run: npm run test:e2e

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == *"main"* ]]; then
            TAG_NAME="v$(date +'%Y.%m.%d')-manual"
          fi

          echo "Publishing GitHub Release for tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            --draft=false \
            --prerelease=false
