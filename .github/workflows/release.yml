name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Full Verification Gate
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3003
          NEXT_PUBLIC_APP_URL: http://localhost:3003
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
        run: bun run verify

      - name: Run Playwright E2E Tests (Safe Check)
        run: |
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ] || grep -q "playwright" package.json || [ -f "apps/web/playwright.config.ts" ]; then
            bun --filter=@spotting/web test:e2e
          else
            echo "No Playwright configuration or scripts found in workspace. Skipping E2E test execution."
          fi
        shell: bash

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          # Fallback if manually dispatched without a tag context
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == *"main"* ]]; then
            TAG_NAME="v$(date +'%Y.%m.%d')-manual"
          fi
          
          echo "Publishing GitHub Release for tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            --draft=false \
            --prerelease=false
