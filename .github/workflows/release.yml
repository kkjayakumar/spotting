name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Build and push container images to GHCR (manual release only)'
        type: boolean
        default: false
      image_tag:
        description: 'GHCR image tag when publish_images is true (e.g. v1.0.0)'
        required: false

jobs:
  verify-and-release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotting_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Verification Gate
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3003
          NEXT_PUBLIC_APP_URL: http://localhost:3003
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
        run: npm run verify

      - name: Get Playwright Version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/^\\^/, '')")
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers & Deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright System Dependencies (if cached)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Ensure Playwright Chromium (cache may be stale)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotting_release?schema=public
          NEXT_PUBLIC_SITE_URL: http://localhost:3003
          NEXT_PUBLIC_APP_URL: http://localhost:3003
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "false"
          SPOTTING_API_INTERNAL_URL: http://127.0.0.1:3000
          CORS_ORIGINS: http://localhost:3003
          SPOTTING_AUTH_SECRET: ci-e2e-spotting-auth-secret-minimum-32-chars
          SPOTTING_AUTH_URL: http://localhost:3000
          SPOTTING_ACCEPT_LEGACY_CRK_KEYS: "true"
          PLAYWRIGHT_REUSE_SERVER: "false"
          API_PORT: "3000"
        run: npm run test:e2e

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [[ "$TAG_NAME" == *"main"* ]]; then
            TAG_NAME="v$(date +'%Y.%m.%d')-manual"
          fi

          echo "Publishing GitHub Release for tag: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            --draft=false \
            --prerelease=false

  publish-containers:
    name: Publish containers to GHCR
    needs: verify-and-release
    if: >-
      needs.verify-and-release.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_images == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spotting-api
            dockerfile: apps/api/Dockerfile
          - image: spotting-web
            dockerfile: apps/web/Dockerfile
            web_build_args: true
          - image: spotting-worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="latest"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.version.outputs.tag != 'latest' }}

      - name: Build and push (web)
        if: matrix.web_build_args == true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://__SPOTTING_SITE_URL__
            NEXT_PUBLIC_APP_URL=https://__SPOTTING_APP_URL__
            NEXT_PUBLIC_SERVER_URL=https://__SPOTTING_SERVER_URL__
            NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=false
            SPOTTING_API_INTERNAL_URL=http://api:3000
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push
        if: matrix.web_build_args != true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Publish summary
        if: matrix.image == 'spotting-api'
        run: |
          OWNER="${{ steps.version.outputs.owner }}"
          TAG="${{ steps.version.outputs.tag }}"
          {
            echo "## Container images (GHCR)"
            echo ""
            echo "| Service | Pull |"
            echo "|---------|------|"
            echo "| API | \`docker pull ghcr.io/${OWNER}/spotting-api:${TAG}\` |"
            echo "| Web | \`docker pull ghcr.io/${OWNER}/spotting-web:${TAG}\` |"
            echo "| Worker | \`docker pull ghcr.io/${OWNER}/spotting-worker:${TAG}\` |"
            echo ""
            echo "EC2: [docs/deployment/ec2-ghcr-hosting.md](docs/deployment/ec2-ghcr-hosting.md)"
          } >> "$GITHUB_STEP_SUMMARY"
