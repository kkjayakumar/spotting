<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotting | Interactive Bug Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Navigation Card in Right Corner */
        .nav-card {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 280px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            border-color: rgba(79, 70, 229, 0.4);
        }

        .nav-card h3 {
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .nav-card p {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 0.75rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:hover {
            background: #4338ca;
            box-shadow: 0 0 25px rgba(79, 70, 229, 0.6);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Central Content */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            pointer-events: none;
            user-select: none;
        }

        .spider-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 20px rgba(79, 70, 229, 0.5));
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -3px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to bottom, #fff 50%, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1.5rem;
            color: #6366f1;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="spiderweb"></canvas>

    <div class="nav-card">
        <div>
            <h3>Ready to Spot?</h3>
            <p>Join the future of debugging.</p>
        </div>
        <a href="/login" class="btn btn-primary">Sign In</a>
        <a href="/register" class="btn btn-secondary">Create Account</a>
    </div>

    <div class="content">
        <svg class="spider-icon" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
            <path d="M3 7l6 5" />
            <path d="M3 17l6 -5" />
            <path d="M21 7l-6 5" />
            <path d="M21 17l-6 -5" />
            <path d="M12 4v5" />
            <path d="M12 15v5" />
            <path d="M7 3l5 9" />
            <path d="M17 3l-5 9" />
            <path d="M7 21l5 -9" />
            <path d="M17 21l-5 -9" />
        </svg>
        <h1>SPOTTING</h1>
        <div class="tagline">Interactive Bug Detection</div>
    </div>

    <script>
        const canvas = document.getElementById('spiderweb');
        const ctx = canvas.getContext('2d');

        let width, height;
        const particles = [];
        const properties = {
            bgColor: '#0a0a0a',
            particleColor: 'rgba(79, 70, 229, 0.8)',
            lineColor: 'rgba(79, 70, 229, 0.3)',
            particleRadius: 2.5,
            particleCount: 150,
            particleMaxVelocity: 0.4,
            lineMaxDist: 180,
            mouseDist: 250,
            mouseAttraction: 0.03
        };

        const mouse = { x: null, y: null };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('resize', reInit);

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * properties.particleMaxVelocity;
                this.vy = (Math.random() - 0.5) * properties.particleMaxVelocity;
            }

            update() {
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
                this.x += this.vx;
                this.y += this.vy;

                if (mouse.x !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if (d < properties.mouseDist) {
                        this.x += dx * properties.mouseAttraction;
                        this.y += dy * properties.mouseAttraction;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, properties.particleRadius, 0, Math.PI * 2);
                ctx.fillStyle = properties.particleColor;
                ctx.fill();
            }
        }

        function reInit() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles.length = 0;
            for(let i=0; i<properties.particleCount; i++) particles.push(new Particle());
        }

        function loop() {
            ctx.clearRect(0, 0, width, height);
            for(let p of particles) {
                p.update();
                p.draw();
            }
            for(let i=0; i<particles.length; i++) {
                for(let j=i+1; j<particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if(d < properties.lineMaxDist) {
                        ctx.lineWidth = 1;
                        ctx.strokeStyle = `rgba(79, 70, 229, ${1 - d/properties.lineMaxDist})`;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(loop);
        }

        reInit();
        loop();
    </script>
</body>
</html>
