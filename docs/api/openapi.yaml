openapi: 3.1.0
info:
  title: Spotting API
  version: 1.0.0
  description: |
    Spotting REST API (`apps/api/src/v1.ts` + capture public router).
    Authenticated routes use `Authorization: Bearer <session-token>`.
    Org-scoped report routes accept optional `x-org-id`.
  contact:
    name: Spotting Engineering
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: http://localhost:3000/v1
    description: Local development
  - url: https://api-spotting.yourdomain.com/v1
    description: Production

tags:
  - name: Auth
  - name: Organizations
  - name: Reports
  - name: Billing
  - name: CaptureKeys
  - name: CapturePublic

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
  parameters:
    OrgIdHeader:
      name: x-org-id
      in: header
      required: false
      schema:
        type: string
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
    Report:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        priority:
          type: string
          enum: [low, medium, high, critical]
        visibility:
          type: string
          enum: [private, public]
        pageUrl:
          type: string
          nullable: true
        metadataJson:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportListPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        "201":
          description: Account created
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/signin:
    post:
      tags: [Auth]
      summary: Sign in and receive bearer session token
      responses:
        "200":
          description: Session issued

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh session token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New session token

  /auth/signout:
    post:
      tags: [Auth]
      summary: Revoke current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Signed out

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
    patch:
      tags: [Auth]
      summary: Update profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated profile

  /auth/change-password:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Password changed

  /auth/resend-verification:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification email sent

  /auth/verify-email:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Email verified

  /auth/forgot-password:
    post:
      tags: [Auth]
      responses:
        "200":
          description: Reset OTP sent if account exists

  /auth/reset-password:
    post:
      tags: [Auth]
      responses:
        "200":
          description: Password reset

  /orgs:
    get:
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizations for current user
    post:
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Organization created

  /orgs/{orgId}:
    patch:
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization updated
    delete:
      tags: [Organizations]
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization deleted

  /orgs/{orgId}/members:
    get:
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member list

  /orgs/{orgId}/invites:
    get:
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending invitations
    post:
      tags: [Organizations]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Invitation created

  /reports:
    get:
      tags: [Reports]
      summary: Paginated report list for current org
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Report page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListPage"
    post:
      tags: [Reports]
      summary: Create report (authenticated capture)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "201":
          description: Report created

  /reports/stats:
    get:
      tags: [Reports]
      summary: Dashboard counters
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgIdHeader"
      responses:
        "200":
          description: Stats snapshot

  /reports/bulk:
    patch:
      tags: [Reports]
      summary: Bulk update status, priority, visibility, and/or tags
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                priority:
                  type: string
                visibility:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Bulk update result
    delete:
      tags: [Reports]
      summary: Bulk delete reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bulk delete result

  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: Fetch report (org member or public visibility)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report detail
    patch:
      tags: [Reports]
      summary: Update report fields
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Updated report
    delete:
      tags: [Reports]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report deleted

  /reports/{reportId}/events:
    get:
      tags: [Reports]
      summary: Debugger timeline (actions, console, network summary)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Debugger events payload

  /reports/{reportId}/network:
    get:
      tags: [Reports]
      summary: Paginated network request list
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Network page

  /reports/{reportId}/network/{requestId}:
    get:
      tags: [Reports]
      summary: Network request payload (headers/bodies)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Request detail

  /reports/{reportId}/retry:
    post:
      tags: [Reports]
      summary: Retry debugger ingestion metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Retry accepted

  /reports/{reportId}/share:
    get:
      tags: [Reports]
      summary: Resolve public share URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Share URL

  /reports/upload-sessions:
    post:
      tags: [Reports]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Upload session created

  /reports/upload-sessions/{sessionId}/finalize:
    post:
      tags: [Reports]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upload finalized

  /orgs/{orgId}/billing/plan:
    get:
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing snapshot

  /billing/plan-limits:
    get:
      tags: [Billing]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plan limits matrix

  /orgs/{orgId}/capture-keys:
    get:
      tags: [CaptureKeys]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Capture public keys
    post:
      tags: [CaptureKeys]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Key created

  /capture/reports:
    post:
      tags: [CapturePublic]
      summary: Submit report via embed capture key (no user session)
      security: []
      responses:
        "201":
          description: Report captured

  /capture/upload-sessions:
    post:
      tags: [CapturePublic]
      security: []
      responses:
        "201":
          description: Public upload session

  /capture/upload-sessions/{sessionId}/finalize:
    post:
      tags: [CapturePublic]
      security: []
      responses:
        "200":
          description: Public upload finalized
